<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1014">
  <title>Llamadas</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style id="wa-nav">
#bottomNav{background:#0b141a !important;border-top:1px solid #1c272e !important}
#bottomNav .nav-item{flex:1;display:flex;justify-content:center;padding:6px 0 8px;cursor:pointer}
#bottomNav .nav-pill{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px;border-radius:18px;color:#8696a0;font-size:12px;transition:.2s}
#bottomNav .nav-ic svg{display:block}
#bottomNav .nav-item.active .nav-pill{background:#0b3c2e;color:#fff;font-weight:600}
#ctxMenu{background:#1f2c34 !important;border:none !important;border-radius:16px !important;box-shadow:0 8px 28px rgba(0,0,0,.6) !important}
.ctx-item{color:#e9edef !important;border-bottom:none !important;padding:15px 22px !important;font-size:16px}
.ctx-item:active{background:#2a3942 !important}
#archbar{display:none;align-items:center;gap:18px;padding:14px 16px;background:#0b141a;color:#e9edef;font-size:20px;font-weight:600}
body.arch-mode #topbar,body.arch-mode #fab{display:none !important}
body.arch-mode #archbar{display:flex}
</style>
  <style id="wa-nav2">
html #bottomNav{display:flex;justify-content:space-around;align-items:flex-start;background:#0b141a !important;border-top:1px solid #1c272e !important;padding:6px 0 env(safe-area-inset-bottom) !important;flex-shrink:0}
html #bottomNav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:4px 0 6px !important;cursor:pointer;color:#e9edef !important;font-size:12px !important;font-weight:400;text-align:center;line-height:1.1}
html #bottomNav .nav-item.active{color:#e9edef !important;font-weight:700}
html #bottomNav .nav-item > div.nav-pill:first-child{width:58px;height:30px;border-radius:15px;display:flex;flex-direction:row;gap:0;align-items:center;justify-content:center;padding:0;background:transparent;filter:none;opacity:1;font-size:inherit !important;color:inherit;font-weight:inherit;transition:background .2s}
html #bottomNav .nav-item.active > div.nav-pill:first-child{background:#0f3a2d;filter:none;opacity:1}
html #bottomNav .nav-ic{position:relative;display:flex;font-size:inherit !important}
html #bottomNav .nav-ic svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html #bottomNav .nav-item.active .nav-ic svg .fl{fill:#d9fdd3;stroke:#d9fdd3}
html #bottomNav .nav-item.active .nav-ic svg .st{stroke:#d9fdd3}
html #bottomNav .nav-item.active .nav-ic svg .dt{stroke:#0f3a2d}
html #bottomNav .nav-label{font-size:12px}
</style>
  <style id="wa-bg">
:root{--bg:#0b1014}
html body{background:#0b1014}
html #topbar,html #searchBar,html #archbar{background:#0b1014 !important}
html #filters,html #chatList,html .section-label,html #emptyState{background:#0b1014}
html .chat-item{background:#0b1014}
html #bottomNav{background:#0b1014 !important;border-top-color:#161c20 !important}
</style>
  <style>
    :root{--bg:#0b1014;--tx:#e9edef;--sub:#8d979e;--gr:#21c063;--red:#f0536a;--card:#1d2327}
    html,body{height:100%;margin:0}
    body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)!important;color:var(--tx);font-family:Roboto,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
    .wc-head{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 14px 6px 16px;min-height:56px;flex-shrink:0;box-sizing:border-box}
    .wc-title{flex:1;font-size:24px;font-weight:400}
    .wc-ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);flex-shrink:0}
    .wc-ib:active{background:#1d2327}
    .wc-head.sel{background:#141b20}.wc-hn{flex:1;font-size:20px}
    .wc-si{flex:1;min-width:0;background:#171c20;border:0;outline:0;color:var(--tx);font-size:18px;padding:11px 18px;border-radius:24px;caret-color:var(--gr)}
    #wcMain{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .wc-quick{display:flex;justify-content:space-between;padding:14px 12px 8px}
    .wc-q{width:20%;text-align:center;cursor:pointer}
    .wc-q .c{width:56px;height:56px;border-radius:50%;background:#1d2327;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;color:var(--tx)}
    .wc-q .c.g{background:#3b2f20;color:#f6c36b}.wc-q:active .c{filter:brightness(1.4)}
    .wc-q .l{font-size:14px;color:#aab3b9}
    .wc-rh{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 6px}
    .wc-rt{font-size:21px;font-weight:500}
    .wc-chips{display:flex;gap:8px}.wc-chip{padding:6px 14px;border-radius:16px;background:#1d2327;color:#aab3b9;font-size:14px;cursor:pointer}.wc-chip.on{background:#0f3d28;color:#21c063}
    .wc-row{display:flex;align-items:center;gap:16px;padding:8px 8px 8px 16px;cursor:pointer;user-select:none;-webkit-user-select:none}
    .wc-row:active,.wc-row.on{background:#141c21}
    .wc-av{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;overflow:hidden}
    .wc-row .tx{flex:1;min-width:0}.wc-row .nm{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wc-row .sb{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:15px;margin-top:3px}.wc-row .ar{display:flex}
    .wc-row .cb{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--tx);flex-shrink:0;border-radius:50%}
    .wc-row .cb:active{background:#1d2327}
    .wc-empty{padding:34px 24px;text-align:center;color:var(--sub);font-size:15px;line-height:1.45}
    .wc-pad{height:110px}
    .wc-fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:17px;border:0;background:var(--gr);color:#08130c;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.45);cursor:pointer;z-index:20}

    .wc-dim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Roboto,system-ui,sans-serif;color:var(--tx)}
    .wc-dim.wc-end{align-items:flex-end;padding:0}.wc-dim.wc-clear{background:transparent;align-items:flex-start;justify-content:flex-end;padding:calc(56px + env(safe-area-inset-top)) 12px 0}
    .wc-menu{background:#171c20;border-radius:20px;padding:8px 0;min-width:230px;box-shadow:0 8px 28px rgba(0,0,0,.6)}
    .wc-mi{padding:15px 24px;font-size:18px;cursor:pointer;white-space:nowrap}.wc-mi:active{background:#1f272c}
    .wc-dlg{background:#1d2226;border-radius:26px;padding:24px 24px 12px;max-width:340px;width:100%}
    .wc-dlg h3{margin:0 0 10px;font-size:21px;font-weight:500}.wc-dlg p{margin:0 0 14px;font-size:16.5px;line-height:1.45;color:#c4cbd0}
    .wc-bt{display:flex;justify-content:flex-end;gap:22px}.wc-bt span{color:var(--gr);font-weight:500;font-size:16px;padding:10px 4px;cursor:pointer}
    .wc-sheet{background:#1b2227;border-radius:24px 24px 0 0;width:100%;padding:8px 0 calc(14px + env(safe-area-inset-bottom));max-height:80dvh;overflow-y:auto;animation:wcUp .18s ease-out}
    @keyframes wcUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
    .wc-st{padding:16px 22px 8px;font-size:19px;font-weight:500}
    .wc-sr{display:flex;gap:20px;align-items:center;padding:13px 22px;cursor:pointer}.wc-sr:active{background:#222b31}
    .wc-sr .i{color:#aab3b9;width:26px;display:flex;justify-content:center}.wc-sr .t{font-size:17.5px}.wc-sr .s{font-size:13.5px;color:var(--sub);margin-top:2px}
    .wc-note{padding:10px 22px 4px;font-size:13px;color:var(--sub);line-height:1.45;white-space:pre-line}
    .wc-scr{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column;animation:wcIn .16s ease-out}
    @keyframes wcIn{from{transform:translateX(22px);opacity:0}to{transform:none;opacity:1}}
    .wc-sh{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px 8px;border-bottom:1px solid #161b1f;flex-shrink:0}
    .wc-stt{flex:1;font-size:21px}.wc-sb{flex:1;min-height:0;overflow-y:auto}
    .wc-pks{padding:10px 14px}.wc-pks input{width:100%;box-sizing:border-box;background:#171c20;border:0;outline:0;color:var(--tx);font-size:17px;padding:12px 18px;border-radius:24px;caret-color:var(--gr)}
    .wc-pr{display:flex;align-items:center;gap:16px;padding:9px 16px;cursor:pointer}.wc-pr:active{background:#141c21}
    .wc-pr .a{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .wc-pr .t{flex:1;min-width:0}.wc-pr .n{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wc-pr .s{font-size:14px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .wc-info{margin:12px 14px;padding:12px 14px;background:#15201a;border-radius:14px;font-size:13.5px;line-height:1.45;color:#b7c4bb}
    .wc-kp{display:flex;flex-direction:column;align-items:center;padding:20px 24px calc(20px + env(safe-area-inset-bottom));min-height:100%;box-sizing:border-box}
    .wc-kp .dsp{font-size:32px;min-height:46px;margin-top:10px;letter-spacing:1px;text-align:center;word-break:break-all}.wc-kp .dsp.ph{font-size:16px;color:var(--sub);letter-spacing:0;margin-top:22px}
    .wc-kp .chk{height:22px;font-size:14px;color:var(--sub);margin-bottom:8px}
    .wc-kp .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 26px;width:100%;max-width:330px}
    .wc-kp .k{height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;color:var(--tx);user-select:none}.wc-kp .k:active{background:#1d2327}.wc-kp .z{pointer-events:none}
    .wc-kp .act{margin-top:16px}.wc-callbtn{width:68px;height:68px;border-radius:50%;border:0;background:var(--gr);color:#08130c;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .wc-form{padding:4px 16px 30px}.wc-form .lbl{margin:16px 0 6px;font-size:14px;color:var(--sub)}
    .wc-form input,.wc-form .pick{width:100%;box-sizing:border-box;background:#171c20;border:0;outline:0;color:var(--tx);font-size:17px;padding:14px 16px;border-radius:14px;color-scheme:dark}
    .wc-form .pick{cursor:pointer}.wc-form .seg{display:flex;gap:8px}.wc-form .seg span{flex:1;text-align:center;padding:12px;border-radius:14px;background:#171c20;cursor:pointer}.wc-form .seg span.on{background:#0f3d28;color:var(--gr)}
    .wc-save{margin-top:24px;width:100%;padding:15px;border:0;border-radius:26px;background:var(--gr);color:#08130c;font-size:17px;font-weight:600;cursor:pointer}
    .wc-sw{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}.wc-sw:active{background:#141c21}.wc-sw .tx{flex:1}.wc-sw .t{font-size:17.5px}.wc-sw .s{font-size:13.5px;color:var(--sub);margin-top:2px}
    .wc-sw .sw{width:46px;height:26px;border-radius:13px;background:#3a444b;position:relative;flex-shrink:0}.wc-sw .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#aab3b9;transition:.15s}.wc-sw .sw.on{background:#0f5a34}.wc-sw .sw.on i{left:23px;background:var(--gr)}
    .wc-toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(32,42,49,.97);padding:10px 18px;border-radius:20px;font-size:14.5px;z-index:3000;max-width:86vw;text-align:center;pointer-events:none;color:var(--tx);font-family:Roboto,system-ui,sans-serif}
    /* barra inferior (la misma del resto del panel) */
    .wcnav{flex-shrink:0;display:flex;justify-content:space-around;align-items:center;background:#0f1519;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #161b1f}
    .wcnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#c4cbd0;font-size:13px;font-weight:500;position:relative}
    .wcnav a .pill{width:62px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
    .wcnav a.active{color:#fff;font-weight:700}.wcnav a.active .pill{background:#14352a;color:#8ef0b4}
    .wcnav .bdg{position:absolute;top:-4px;left:calc(50% + 8px);background:var(--gr);color:#08130c;border-radius:10px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}
  </style>
</head>
<body>
  <div class="wc-head" id="wcHead"></div>
  <div id="wcMain"></div>
  <button class="wc-fab" id="wcFab" aria-label="Nueva llamada"><svg viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M20 15.5c-1.25 0-2.45-.2-3.57-.57a1 1 0 0 0-1.02.24l-2.2 2.2a15 15 0 0 1-6.59-6.59l2.2-2.21a1 1 0 0 0 .25-1A11.4 11.4 0 0 1 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z" transform="translate(-1.5 1.5) scale(.9)"/><path d="M17.5 3v6M14.5 6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>

  <script src="/socket.io/socket.io.js"></script>

  <script src="/js/activity.js"></script>
  
  <script>
;(function () {
  const idx = location.pathname.startsWith('/status') ? 1
            : location.pathname.startsWith('/communit') ? 2
            : location.pathname.startsWith('/calls') ? 3 : 0
  document.querySelectorAll('#bottomNav .nav-item').forEach((e, i) => e.classList.toggle('active', i === idx))
})()
</script>
  <script>
;(function () {
  function badge(i, n) {
    const it = document.querySelectorAll('#bottomNav .nav-item')[i]
    if (!it) return
    const ic = it.querySelector('.nav-ic') || it.firstElementChild
    let b = ic.querySelector('.nbadge')
    if (!n) { if (b) b.remove(); return }
    if (!b) {
      b = document.createElement('span')
      b.className = 'nbadge'
      b.style.cssText = 'position:absolute;top:-4px;right:2px;background:#00a884;color:#0b141a;border-radius:9px;font-size:11px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center'
      ic.style.position = 'relative'
      ic.appendChild(b)
    }
    b.textContent = n > 99 ? '99+' : n
  }
  async function tick() {
    try {
      const cs = JSON.parse(localStorage.getItem('chatState') || '{}')
      badge(0, Object.values(cs).reduce((a, s) => a + (s.unread || 0), 0))
    } catch (e) {}
    try {
      const onCalls = location.pathname.startsWith('/calls')
      const seen = +localStorage.getItem('callsSeen') || 0
      if (onCalls) localStorage.setItem('callsSeen', Date.now())
      const calls = await (await fetch('/calls')).json()
      badge(3, onCalls ? 0 : calls.filter(c => (c.status === 'timeout' || c.status === 'reject') && (c.date || 0) > seen).length)
    } catch (e) {}
  }
  tick()
  setInterval(tick, 5000)
})()
</script>
  <script id="wa-nav2-js">(function(){var p=location.pathname,i=p.indexOf('/status')===0?1:p.indexOf('/communit')===0?2:p.indexOf('/calls')===0?3:0;document.querySelectorAll('#bottomNav .nav-item').forEach(function(e,k){e.classList.toggle('active',k===i)})})()</script>
