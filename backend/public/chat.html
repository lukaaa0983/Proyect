<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto G</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    /* ── MEJORAS VISUALES CHAT ── */

    /* Fondo con patrón sutil */
    #messages {
      background:
        radial-gradient(circle at 20% 50%, rgba(201,168,76,0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(201,168,76,0.02) 0%, transparent 50%),
        var(--bg);
    }

    /* Burbujas con sombra sutil */
    .bubble.received {
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .bubble.sent {
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* Wrap con avatar */
    .msg-wrap {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 8px;
      max-width: 88%;
    }

    .msg-wrap.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-wrap.received {
      align-self: flex-start;
    }

    /* Avatar del contacto */
    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--surface3), var(--surface2));
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--gold-light);
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .msg-avatar.hidden {
      visibility: hidden;
    }

    /* Columna de burbujas */
    .msg-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .msg-wrap.sent  .msg-col { align-items: flex-end; }
    .msg-wrap.received .msg-col { align-items: flex-start; }

    /* Nombre + número sobre la burbuja */
    .msg-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
      padding-left: 2px;
    }

    .msg-meta-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--gold);
    }

    .msg-meta-number {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* Burbuja más redondeada */
    .bubble {
      border-radius: 16px;
      padding: 8px 12px;
    }

    .bubble.received { border-bottom-left-radius: 4px; }
    .bubble.sent     { border-bottom-right-radius: 4px; }

    /* Reply quote mejorada */
    .reply-quote {
      border-left: 3px solid var(--gold);
      padding: 6px 10px;
      margin-bottom: 6px;
      background: rgba(0,0,0,0.25);
      border-radius: 0 10px 10px 0;
      font-size: 12px;
    }

    .reply-quote-name {
      color: var(--gold);
      font-weight: 700;
      font-size: 11px;
      margin-bottom: 2px;
    }

    .reply-quote-text {
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Hora */
    .msg-time {
      font-size: 10px;
      color: var(--text-dim);
      text-align: right;
      margin-top: 3px;
      opacity: 0.8;
    }

    /* Scroll indicator mejorado */
    #newMsgIndicator {
      background: var(--gold);
      color: #000;
      font-weight: 700;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      box-shadow: 0 2px 12px rgba(201,168,76,0.4);
    }

    /* Input area mejorada */
    #inputArea {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }

    /* Botón enviar animado */
    #sendBtn {
      transition: transform 0.1s, opacity 0.2s;
    }

    #sendBtn:active {
      transform: scale(0.9);
    }

    /* Header mejorado */
    #header {
      background: linear-gradient(180deg, #161616, var(--surface));
      border-bottom: 1px solid rgba(201,168,76,0.15);
    }

    #chatName {
      font-size: 16px;
      font-weight: 700;
    }

    #chatStatus {
      font-size: 11px;
      color: var(--gold-dim);
    }
  </style>
<style id="wa-skin">

#inputArea{padding:6px 8px calc(8px + env(safe-area-inset-bottom)) !important}

</style>
<style id="wa-skin3">
.msg-meta-name,.msg-meta-number,.msg-avatar{cursor:pointer}
</style>
<style id="wa-skin4">
#lightbox-img{touch-action:none}
</style>
<style id="wa-quote">
.reply-quote{border-left:4px solid #06cf9c;background:rgba(0,0,0,.22);border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:13px;max-width:100%}
.reply-quote-name{color:#06cf9c;font-weight:600;font-size:12.5px}
.reply-quote-text{color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<style id="wa-group">
.msg-wrap{min-width:0;max-width:88% !important}
.msg-col{min-width:0;max-width:100%}
.bubble{max-width:100%;min-width:0;box-sizing:border-box;overflow-wrap:anywhere;word-break:break-word;font-size:15.5px;line-height:1.38;padding:7px 10px 6px !important}
.reply-quote{box-sizing:border-box;width:100%;min-width:min(200px,100%);overflow:hidden}
.reply-quote-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-quote-text{white-space:normal !important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:clip !important;word-break:break-word}
.msg-meta{margin-bottom:2px;gap:8px;max-width:100%}
.msg-meta-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}
.adm-tag{margin-left:auto;font-size:11px;color:#8696a0;padding-left:10px;white-space:nowrap}
.msg-time{font-size:11px;margin-top:2px}
.sys-msg{align-self:center;max-width:86%;text-align:center;background:#182229;color:#8696a0;font-size:12.5px;padding:6px 14px;border-radius:12px;margin:8px auto}
.mention{color:#53bdeb;font-weight:600}
#chatStatus{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.msg-wrap.cont .msg-meta{display:none}
.msg-wrap.noav .msg-avatar{visibility:hidden}
body.dm .msg-meta,body.dm .msg-avatar{display:none !important}
</style>
<style id="wa-input">
html #pill{background:#202c33;align-items:center}
html #pill .pbtn{display:flex;align-items:center;justify-content:center;width:38px !important;height:48px !important;padding:0 !important;font-size:0 !important;color:#8d9aa0 !important;background:transparent !important;border-radius:0 !important;flex-shrink:0}
html #pill .pbtn svg{display:block}
html #pill #msgInput{align-self:stretch}
html #sendBtn{background:#21c063 !important;color:#0b141a !important;display:flex;align-items:center;justify-content:center;width:50px !important;height:50px !important;padding:0 !important;font-size:0 !important;border-radius:50% !important}
html #sendBtn svg{display:block}
</style>

<style id="wa-chat-header-final">
#header.wa-chat-header {
  height:60px; min-height:60px; padding:0 8px 0 10px;
  gap:0; background:#202c33!important; border:0!important;
  display:flex; align-items:center; flex-shrink:0;
}
#header .wa-back {
  width:38px; height:48px; flex:0 0 38px; border:0;
  background:transparent; color:#e9edef; display:flex;
  align-items:center; justify-content:center; padding:0;
}
#header .wa-back svg {
  width:25px; height:25px; fill:none; stroke:currentColor;
  stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
}
#header .wa-chat-avatar {
  width:42px!important; height:42px!important;
  flex:0 0 42px; margin:0 10px 0 0;
  border:0!important; background:#374248!important;
  color:#e9edef!important; font-size:18px!important;
  overflow:hidden; cursor:pointer;
}
#header .wa-chat-avatar img {
  width:100%; height:100%; object-fit:cover; border-radius:50%;
}
#header #header-info {
  flex:1; min-width:0; display:flex; flex-direction:column;
  justify-content:center; gap:2px; cursor:pointer; padding:0;
}
#header #chatName {
  font-size:16px; line-height:21px; font-weight:600;
  color:#e9edef; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis;
}
#header #chatStatus {
  font-size:12px; line-height:16px; color:#aebac1;
  margin:0; white-space:nowrap; overflow:hidden;
}
#header #chatStatus:empty { display:none; }
#header .wa-head-action {
  width:42px; height:48px; flex:0 0 42px;
  display:flex; align-items:center; justify-content:center;
  padding:0; border:0; background:transparent; color:#e9edef;
}
#header .wa-head-action svg {
  width:24px; height:24px; fill:none; stroke:currentColor;
  stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;
}
#header .wa-more { width:34px; flex-basis:34px; }
#header .wa-more svg { fill:currentColor; stroke:none; }
@media(max-width:380px) {
  #header.wa-chat-header { padding-left:5px; padding-right:4px; }
  #header .wa-chat-avatar {
    width:39px!important; height:39px!important;
    flex-basis:39px; margin-right:8px;
  }

}
</style>
</head>
<body>

  <!-- CABECERA WHATSAPP -->
  <header id="header" class="wa-chat-header">
    <button class="wa-back" type="button" aria-label="Volver"
      onclick="history.length > 1 ? history.back() : location.href='/'">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="avatar wa-chat-avatar" id="avatar"
      role="button" tabindex="0" aria-label="Ver contacto"
      onclick="openChatProfile()">?</div>
    <div id="header-info" role="button" tabindex="0"
      onclick="openChatProfile()">
      <div id="chatName">Cargando...</div>
      <div id="chatStatus"></div>
    </div>
    <button class="wa-head-action" id="hdrVideo" type="button"
      aria-label="Videollamada" onclick="callPeer(true)">
      <svg viewBox="0 0 24 24"><path d="M15 10l5-3v10l-5-3"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <button class="wa-head-action" id="hdrCall" type="button"
      aria-label="Llamada" onclick="callPeer(false)">
      <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-3 2a15 15 0 0 0 5 5l2-3 5 2v4c0 1-1 2-2 2C10 21 3 14 3 6c0-1 1-2 2-2z"/></svg>
    </button>
    <button class="wa-head-action wa-more" type="button"
      aria-label="Más opciones" onclick="toggleChatMenu(event)">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="5" r="1.7"/>
        <circle cx="12" cy="12" r="1.7"/>
        <circle cx="12" cy="19" r="1.7"/>
      </svg>
    </button>
  </header>

  <!-- MENSAJES -->
  <div id="messages">
    <div id="newMsgIndicator" onclick="scrollToBottom()">↓ Nuevo mensaje</div>
  </div>

  <!-- REPLY PREVIEW -->
  <div id="replyPreview">
    <div id="replyBar"></div>
    <div id="replyPreview-text">
      <strong id="replyPreview-name"></strong>
      <span id="replyPreview-content"></span>
    </div>
    <div id="replyCancel" onclick="cancelReply()">✕</div>
  </div>

  <!-- IMG PREVIEW -->
  <div id="imgPreviewBar">
    <img id="imgPreviewThumb" src="" alt="">
    <span id="imgPreviewName"></span>
    <span id="imgPreviewCancel" onclick="cancelImage()">✕</span>
  </div>

  <!-- INPUT -->
  <div id="inputArea">
    <div id="pill">
      <div class="pbtn" onclick="toggleEmoji()"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0-6.4-2.6"/><path d="M12 21c-.4-3.4-2.4-4.6-6.4-2.6"/><circle cx="9" cy="10" r=".9" fill="currentColor"/><circle cx="15" cy="10" r=".9" fill="currentColor"/><path d="M8.6 13.6c1.9 2 4.9 2 6.8 0"/></svg></div>
      <textarea id="msgInput" placeholder="Mensaje" rows="1" autocomplete="off"></textarea>
      <div class="pbtn" id="imgBtn" onclick="document.getElementById('imgInput').click()"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><g transform="rotate(22 12 12)"><path d="M16.2 7v9.5a4.2 4.2 0 0 1-8.4 0V6a2.7 2.7 0 0 1 5.4 0v10a1.2 1.2 0 0 1-2.4 0V7.5"/></g></svg></div>
      <div class="pbtn" id="camBtn" onclick="document.getElementById('camInput').click()"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2 2 0 0 1 6 6.5h2L9.4 4.5h5.2L16 6.5h2a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.6" r="3.3"/></svg></div>
    </div>
    <input type="file" id="imgInput" accept="*/*" style="display:none">
    <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">
    <button id="sendBtn" data-ic="mic" onclick="sendOrRecord()"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" stroke="none"/><path d="M5.8 11.5a6.2 6.2 0 0 0 12.4 0M12 18v3M9.5 21h5"/></svg></button>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox">
    <div id="lightbox-header">
      <div class="lb-btn" onclick="closeLightbox()">✕</div>
      <div id="lightbox-sender"></div>
      <div id="lightbox-time"></div>
      <div class="lb-btn" onclick="downloadMedia()">⬇</div>
    </div>
    <div id="lightbox-body">
      <img id="lightbox-img" src="" alt="">
    </div>
    <div id="lightbox-footer">
      <div class="lb-action-btn" onclick="replyFromLightbox()">↩ Responder</div>
      <div class="lb-action-btn gold" onclick="downloadMedia()">⬇ Descargar</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
<div id="gsheet" onclick="if(event.target===this)this.classList.remove('open')"><div id="gbox"><div id="gtitle"></div><div id="gmeta"></div><div id="gdesc"></div><div id="gmembers"></div></div></div>
<style>#gsheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;align-items:flex-end}#gsheet.open{display:flex}#gbox{background:var(--surface);width:100%;max-height:80dvh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}#gtitle{font-size:20px;font-weight:700;color:var(--gold)}#gmeta,#gdesc{color:var(--text-dim);font-size:13px;margin:6px 0}#gmembers div{padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.adm{color:var(--gold);font-size:12px}</style>
<script>
async function openGroupInfo() {
  if (!chatId.endsWith('@g.us')) return
  document.getElementById('gsheet').classList.add('open')
  const t = document.getElementById('gtitle'); t.textContent = 'Cargando...'
  try {
    const g = await (await fetch('/group/' + encodeURIComponent(chatId))).json()
    if (!g.ok) { t.textContent = 'No se pudo cargar'; return }
    t.textContent = g.subject
    document.getElementById('gmeta').textContent = g.size + ' participantes' + (g.creation ? ' · creado ' + new Date(g.creation * 1000).toLocaleDateString() : '')
    document.getElementById('gdesc').textContent = g.desc
    const m = document.getElementById('gmembers'); m.innerHTML = ''
    g.participants.sort((a, b) => !!b.admin - !!a.admin).forEach(p => {
      const d = document.createElement('div'), n = document.createElement('span')
      n.textContent = '+' + p.id.split('@')[0].split(':')[0]; d.appendChild(n)
      if (p.admin) { const a = document.createElement('span'); a.className = 'adm'; a.textContent = p.admin === 'superadmin' ? 'Creador' : 'Admin'; d.appendChild(a) }
      m.appendChild(d)
    })
  } catch { t.textContent = 'Error de conexión' }
}
</script>
  <script src="/js/ui.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/activity.js"></script>
  <script src="/js/photo.js"></script>
<script>
function openChatProfile() {
  location.href = (chatId.endsWith('@g.us')
    ? '/group.html?id=' : '/contact.html?id=')
    + encodeURIComponent(chatId);
}
</script>
</body>
</html>
