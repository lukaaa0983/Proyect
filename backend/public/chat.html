<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: #0b141a;
      color: white;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    #header {
      background: #202c33;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    #back {
      cursor: pointer;
      font-size: 20px;
      color: #aebac1;
    }

    #avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2a3942;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
    }

    #chatName {
      font-weight: bold;
      font-size: 16px;
    }

    /* MENSAJES */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
    }

    /* Mensaje recibido (izquierda) */
    .message.received {
      background: #202c33;
      align-self: flex-start;
      border-top-left-radius: 2px;
    }

    /* Mensaje enviado desde panel (derecha) */
    .message.sent {
      background: #005c4b;
      align-self: flex-end;
      border-top-right-radius: 2px;
    }

    .msg-sender {
      color: #53bdeb;
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .msg-sender.sent {
      color: #25d366;
    }

    .msg-content {
      color: #e9edef;
    }

    .msg-time {
      font-size: 11px;
      color: #8696a0;
      text-align: right;
      margin-top: 4px;
    }

    /* INPUT */
    #inputArea {
      background: #202c33;
      padding: 10px 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    #msgInput {
      flex: 1;
      padding: 10px 14px;
      border: none;
      border-radius: 20px;
      background: #2a3942;
      color: white;
      outline: none;
      font-size: 15px;
    }

    #msgInput::placeholder {
      color: #8696a0;
    }

    #sendBtn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #00a884;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    #sendBtn:hover {
      background: #008f6f;
    }

    /* Scrollbar */
    #messages::-webkit-scrollbar {
      width: 5px;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #374045;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <div id="header">
    <span id="back">←</span>
    <div id="avatar">?</div>
    <div>
      <div id="chatName">Cargando...</div>
    </div>
  </div>

  <div id="messages"></div>

  <div id="inputArea">
    <input
      type="text"
      id="msgInput"
      placeholder="Escribe un mensaje..."
      autocomplete="off"
    >
    <button id="sendBtn">➤</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>

    const params = new URLSearchParams(location.search)
    const chatId = params.get("id")

    if (!chatId) location.href = "/"

    const socket = io()
    const messagesContainer = document.getElementById("messages")

    // Unirse al room de este chat
    socket.emit("join_chat", chatId)

    // ========================
    // RENDER DE UN MENSAJE
    // ========================
    function renderMessage(msg) {
      const div = document.createElement("div")
      const isSent = msg.fromMe === true
      div.className = `message ${isSent ? "sent" : "received"}`

      const time = new Date(msg.timestamp).toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      })

      div.innerHTML = `
        ${!isSent ? `<div class="msg-sender">${msg.senderName || "Usuario"}</div>` : ""}
        <div class="msg-content">${msg.content || ""}</div>
        <div class="msg-time">${time}</div>
      `

      messagesContainer.appendChild(div)
    }

    // ========================
    // SCROLL AL ÚLTIMO MENSAJE
    // ========================
    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight
    }

    // ========================
    // CARGAR HISTORIAL
    // ========================
    async function loadChat() {
      const res = await fetch("/chat/" + encodeURIComponent(chatId))
      const data = await res.json()

      // Header
      const name = data.name || chatId
      document.getElementById("chatName").innerText = name
      document.getElementById("avatar").innerText = name.charAt(0).toUpperCase()
      document.title = name

      // Mensajes
      messagesContainer.innerHTML = ""
      const messages = data.messages || []
      messages.forEach(renderMessage)
      scrollToBottom()
    }

    // ========================
    // MENSAJE EN TIEMPO REAL
    // ========================
    socket.on("receive_message", (msg) => {
      renderMessage(msg)
      scrollToBottom()
    })

    // ========================
    // ENVIAR MENSAJE
    // ========================
    function sendMessage() {
      const input = document.getElementById("msgInput")
      const content = input.value.trim()
      if (!content) return

      socket.emit("send_message", {
        chatId,
        content,
        senderName: "Panel"
      })

      input.value = ""
    }

    document.getElementById("sendBtn").onclick = sendMessage

    document.getElementById("msgInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage()
    })

    document.getElementById("back").onclick = () => {
      location.href = "/"
    }

    loadChat()

  </script>
</body>
</html>
