<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto G</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <div id="header">
    <div class="icon-btn" style="color:var(--gold)" onclick="location.href='/'">←</div>
    <div class="avatar" id="avatar" style="width:42px;height:42px;font-size:18px;border-color:var(--gold-dim)">?</div>
    <div id="header-info">
      <div id="chatName">Cargando...</div>
      <div id="chatStatus">WhatsApp</div>
    </div>
    <div class="icon-btn" onclick="scrollToBottom()">↓</div>
  </div>

  <div id="messages">
    <div id="newMsgIndicator" onclick="scrollToBottom()">↓ Nuevo mensaje</div>
  </div>

  <div id="replyPreview">
    <div id="replyBar"></div>
    <div id="replyPreview-text">
      <strong id="replyPreview-name"></strong>
      <span id="replyPreview-content"></span>
    </div>
    <div id="replyCancel" onclick="cancelReply()">✕</div>
  </div>

  <div id="imgPreviewBar">
    <img id="imgPreviewThumb" src="" alt="">
    <span id="imgPreviewName"></span>
    <span id="imgPreviewCancel" onclick="cancelImage()">✕</span>
  </div>

  <div id="inputArea">
    <div id="imgBtn" onclick="document.getElementById('imgInput').click()">📎</div>
    <input type="file" id="imgInput" accept="image/*,video/*,audio/*" style="display:none">
    <textarea id="msgInput" placeholder="Escribe un mensaje..." rows="1" autocomplete="off"></textarea>
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>

  <div id="lightbox">
    <div id="lightbox-header">
      <div class="lb-btn" onclick="closeLightbox()">✕</div>
      <div id="lightbox-sender"></div>
      <div id="lightbox-time"></div>
      <div class="lb-btn" onclick="downloadMedia()">⬇</div>
    </div>
    <div id="lightbox-body">
      <img id="lightbox-img" src="" alt="">
    </div>
    <div id="lightbox-footer">
      <div class="lb-action-btn" onclick="replyFromLightbox()">↩ Responder</div>
      <div class="lb-action-btn gold" onclick="downloadMedia()">⬇ Descargar</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
