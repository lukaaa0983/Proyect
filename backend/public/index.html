<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Proyecto G Chat</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  height:100vh;
  background:#111b21;
  color:white;
}

/* Barra superior */

#topbar{
  background:#202c33;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#title{
  font-size:22px;
  font-weight:bold;
}

#icons{
  display:flex;
  gap:15px;
  font-size:18px;
  color:#aebac1;
}

/* Buscador */

#search{
  padding:10px;
  background:#111b21;
}

#search input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#202c33;
  color:white;
  outline:none;
}

#search input::placeholder{
  color:#8696a0;
}

/* Lista chats */

#sidebar{
  width:100%;
  height:100vh;
  background:#111b21;
  overflow-y:auto;
}

.chat{
  padding:12px 15px;
  cursor:pointer;
  border-bottom:1px solid #202c33;
  display:flex;
  gap:12px;
  align-items:center;
  transition:.15s;
}

.chat:hover{
  background:#202c33;
}

.avatar{
  width:56px;
  height:56px;
  border-radius:50%;
  background:#2a3942;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:22px;
  flex-shrink:0;
}

.chat-info{
  flex:1;
  min-width:0;
}

.chat-name{
  font-weight:bold;
  color:white;
  font-size:16px;
}

.chat-last{
  font-size:13px;
  color:#8696a0;
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.time{
  color:#8696a0;
  font-size:12px;
}

</style>

</head>

<body>

<div id="sidebar">

  <div id="topbar">

    <div id="title">
      Chats
    </div>

    <div id="icons">
      📷
      🔍
      ⋮
    </div>

  </div>

  <div id="search">

    <input
      type="text"
      id="searchInput"
      placeholder="Buscar chat..."
    >

  </div>

  <div id="chatList"></div>

</div>

<script src="/socket.io/socket.io.js"></script>

<!-- =========================
      JAVASCRIPT
========================= -->

<script>

const socket = io()

async function loadChats() {

  const res = await fetch("/chats")
  const chats = await res.json()

  const chatList =
    document.getElementById("chatList")

  chatList.innerHTML = ""

  Object.entries(chats)

  .sort((a, b) => {

    const ultimoA =
      a[1].messages?.[
        a[1].messages.length - 1
      ]?.timestamp || 0

    const ultimoB =
      b[1].messages?.[
        b[1].messages.length - 1
      ]?.timestamp || 0

    return ultimoB - ultimoA

  })

  .forEach(([chatId, chatData]) => {

    const div =
      document.createElement("div")

    div.className = "chat"

    const ultimoMensaje =
      chatData.messages?.[
        chatData.messages.length - 1
      ]

    const hora = ultimoMensaje
      ? new Date(
          ultimoMensaje.timestamp
        ).toLocaleTimeString([], {
          hour:"2-digit",
          minute:"2-digit"
        })
      : ""

    div.innerHTML = `
      <div class="avatar">
        ${(chatData.name || chatId)
          .charAt(0)
          .toUpperCase()}
      </div>

      <div class="chat-info">

        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
        ">

          <div class="chat-name">
            ${chatData.name || chatId}
          </div>

          <div style="
            color:#8696a0;
            font-size:12px;
          ">
            ${hora}
          </div>

        </div>

        <div class="chat-last">
          ${ultimoMensaje?.senderName || ""}
          ${ultimoMensaje?.senderName ? ":" : ""}
          ${ultimoMensaje?.text || ""}
        </div>

      </div>
    `

    div.onclick = () => {

      location.href =
        "/chat.html?id=" +
        encodeURIComponent(chatId)

    }

    chatList.appendChild(div)

  })

}

socket.on("new_message", async () => {

  await loadChats()

})

loadChats()

</script>

</body>
</html>
