<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto G</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
<style id="wa-home">
body{background:#0b141a}
#topbar{background:#0b141a !important;border-bottom:none !important}
#brand-icon{display:none !important}
#title{font-size:24px !important;color:#e9edef !important;font-weight:700 !important}
.icon-btn{background:transparent !important;border:none !important}
.chat-item{padding:12px 16px !important;gap:14px !important;border-bottom:none !important}
.chat-item.has-unread{background:transparent !important}
.avatar{width:52px !important;height:52px !important;border:none !important;border-radius:50% !important;background-color:#2a3942;font-size:22px !important;color:#e9edef}
.chat-name{color:#e9edef !important;font-weight:500 !important;font-size:17px !important}
.chat-preview{color:#8696a0 !important}
.chat-time{color:#8696a0 !important}.chat-time.gold{color:#00a884 !important}
.badge{background:#00a884 !important;color:#0b141a !important;font-weight:700 !important}
.filter-chip{background:#1f2c34 !important;border:none !important;color:#8696a0 !important;border-radius:18px !important}
.filter-chip.active{background:#103629 !important;color:#d9fdd3 !important}
#fab{position:fixed;right:18px;bottom:88px;width:58px;height:58px;border-radius:18px;background:#00a884;color:#0b141a;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:40;cursor:pointer}
</style>
<style id="wa-nav">
#bottomNav{background:#0b141a !important;border-top:1px solid #1c272e !important}
#bottomNav .nav-item{flex:1;display:flex;justify-content:center;padding:6px 0 8px;cursor:pointer}
#bottomNav .nav-pill{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px;border-radius:18px;color:#8696a0;font-size:12px;transition:.2s}
#bottomNav .nav-ic svg{display:block}
#bottomNav .nav-item.active .nav-pill{background:#0b3c2e;color:#fff;font-weight:600}
#ctxMenu{background:#1f2c34 !important;border:none !important;border-radius:16px !important;box-shadow:0 8px 28px rgba(0,0,0,.6) !important}
.ctx-item{color:#e9edef !important;border-bottom:none !important;padding:15px 22px !important;font-size:16px}
.ctx-item:active{background:#2a3942 !important}
#archbar{display:none;align-items:center;gap:18px;padding:14px 16px;background:#0b141a;color:#e9edef;font-size:20px;font-weight:600}
body.arch-mode #topbar,body.arch-mode #fab{display:none !important}
body.arch-mode #archbar{display:flex}
</style>
</head>
<body>

  <div id="topbar">
    <div id="brand">
      <div id="title">WhatsApp</div>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <div class="icon-btn" style="color:#e9edef;font-size:20px" title="Bot: conectándose...">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8a2 2 0 0 1 2-2h1.2l1-1.6A1.5 1.5 0 0 1 9.5 3.6h5a1.5 1.5 0 0 1 1.3.8l1 1.6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.4"/></svg>
      </div>
      <div class="icon-btn" onclick="plusMenu()" style="color:#e9edef;font-size:22px">⋮</div>
    </div>
    <div id="botStatus" style="display:none"><div id="statusDot"></div><span id="statusText">Verificando...</span></div>
  </div>

  <div id="archbar"><span onclick="setFilter('all')" style="cursor:pointer;padding:0 6px">←</span>Archivados</div>
  <div id="searchBar" style="padding:8px 14px 10px;background:#0b141a;flex-shrink:0">
    <div id="search-wrap" style="display:flex;align-items:center;background:#1f2c34;border-radius:24px;padding:0 14px;gap:10px;height:42px">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8696a0" stroke-width="2" style="flex-shrink:0"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Preguntar a Meta AI o buscar" autocomplete="off" style="flex:1;padding:10px 0;border:none;background:transparent;color:var(--text);outline:none;font-size:15px">
    </div>
  </div>

  <div id="filters">
    <div class="filter-chip active" id="chip-all" onclick="setFilter('all')">Todos</div>
    <div class="filter-chip" id="chip-unread" onclick="setFilter('unread')">No leídos</div>
    <div class="filter-chip" id="chip-favorites" onclick="setFilter('favorites')">Favoritos</div>
    <div class="filter-chip" id="chip-groups" onclick="setFilter('groups')">Grupos</div>
    <div class="filter-chip" style="width:32px;padding:5px 0;justify-content:center;flex-shrink:0" onclick="plusMenu()">+</div>
  </div>

  <div id="chatList">
    <div id="emptyState">
      <div class="empty-icon">💬</div>
      <p>Sin conversaciones aún.<br>Los mensajes de WhatsApp<br>aparecerán aquí.</p>
    </div>
  </div>

  <div id="bottomNav" style="display:flex;justify-content:center;background:var(--surface);padding-top:6px;padding-bottom:env(safe-area-inset-bottom);flex-shrink:0">
    <div class="nav-item active" onclick="location.href='/'">
      <div class="nav-pill">
        <div class="nav-ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
        <div class="nav-label">Chats</div>
      </div>
    </div>
    <div class="nav-item" onclick="location.href='/statuses.html'">
      <div class="nav-pill">
        <div class="nav-ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="12" r="6.5"/><circle cx="16" cy="8" r="4"/></svg></div>
        <div class="nav-label">Novedades</div>
      </div>
    </div>
    <div class="nav-item" onclick="location.href='/communities.html'">
      <div class="nav-pill">
        <div class="nav-ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3.5 20c0-3.3 2.5-6 6-6s6 2.7 6 6"/><path d="M14.5 14.3c2.6.3 4.5 2.4 4.5 5.2"/></svg></div>
        <div class="nav-label">Comunidades</div>
      </div>
    </div>
    <div class="nav-item" onclick="location.href='/calls.html'">
      <div class="nav-pill">
        <div class="nav-ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5c0-1 1-2 2-2h2l2 5-2 1.5a12 12 0 0 0 5.5 5.5L15 13l5 2v2c0 1-1 2-2 2C10 19 4 13 4 5z"/></svg></div>
        <div class="nav-label">Llamadas</div>
      </div>
    </div>
  </div>

  <div id="overlay" onclick="closeCtxMenu()"></div>
  <div id="ctxMenu">
    <div class="ctx-item" onclick="ctxAction('fav')"><span class="ctx-icon">⭐</span><span id="ctx-fav-label">Agregar favorito</span></div>
    <div class="ctx-item" onclick="ctxAction('archive')"><span class="ctx-icon">📦</span><span id="ctx-archive-label">Archivar</span></div>
    <div class="ctx-item" onclick="ctxAction('pin')"><span class="ctx-icon">📌</span><span id="ctx-pin-label">Fijar chat</span></div>
    <div class="ctx-item" onclick="ctxAction('mute')"><span class="ctx-icon">🔕</span><span id="ctx-mute-label">Silenciar</span></div>
    <div class="ctx-item" onclick="ctxAction('read')"><span class="ctx-icon">✓</span><span id="ctx-read-label">Marcar como leído</span></div>
    <div class="ctx-item danger" onclick="ctxAction('delete')"><span class="ctx-icon">🗑️</span><span>Eliminar del panel</span></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/index.js"></script>

  <script>
    function toggleSearch() {
      const bar = document.getElementById('searchBar')
      bar.style.display = bar.style.display === 'none' ? 'block' : 'none'
      if (bar.style.display === 'block') {
        document.getElementById('searchInput').focus()
      }
    }
  </script>
<div id="fab" onclick="newChat()">💬</div>
<script>
;(function () {
  const idx = location.pathname.startsWith('/status') ? 1
            : location.pathname.startsWith('/communit') ? 2
            : location.pathname.startsWith('/calls') ? 3 : 0
  document.querySelectorAll('#bottomNav .nav-item').forEach((e, i) => e.classList.toggle('active', i === idx))
})()
</script>
<script>
;(function () {
  function badge(i, n) {
    const it = document.querySelectorAll('#bottomNav .nav-item')[i]
    if (!it) return
    const ic = it.querySelector('.nav-ic') || it.firstElementChild
    let b = ic.querySelector('.nbadge')
    if (!n) { if (b) b.remove(); return }
    if (!b) {
      b = document.createElement('span')
      b.className = 'nbadge'
      b.style.cssText = 'position:absolute;top:-4px;right:2px;background:#00a884;color:#0b141a;border-radius:9px;font-size:11px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center'
      ic.style.position = 'relative'
      ic.appendChild(b)
    }
    b.textContent = n > 99 ? '99+' : n
  }
  async function tick() {
    try {
      const cs = JSON.parse(localStorage.getItem('chatState') || '{}')
      badge(0, Object.values(cs).reduce((a, s) => a + (s.unread || 0), 0))
    } catch (e) {}
    try {
      const onCalls = location.pathname.startsWith('/calls')
      const seen = +localStorage.getItem('callsSeen') || 0
      if (onCalls) localStorage.setItem('callsSeen', Date.now())
      const calls = await (await fetch('/calls')).json()
      badge(3, onCalls ? 0 : calls.filter(c => (c.status === 'timeout' || c.status === 'reject') && (c.date || 0) > seen).length)
    } catch (e) {}
  }
  tick()
  setInterval(tick, 5000)
})()
</script>
</body>
</html>
