<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto G</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <div id="topbar">
    <div id="brand">
      <div id="brand-icon">⚡</div>
      <div>
        <div id="title">Proyecto G</div>
        <div id="botStatus">
          <div id="statusDot"></div>
          <span id="statusText">Verificando...</span>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <div class="icon-btn" onclick="loadChats()">↺</div>
    </div>
  </div>

  <div id="search">
    <div id="search-wrap">
      <span style="color:var(--text-dim);font-size:14px">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar conversación..." autocomplete="off">
    </div>
  </div>

  <div id="filters">
    <div class="filter-chip active" id="chip-all"      onclick="setFilter('all')">Todos <span class="count" id="count-all">0</span></div>
    <div class="filter-chip"        id="chip-unread"   onclick="setFilter('unread')">No leídos <span class="count" id="count-unread">0</span></div>
    <div class="filter-chip"        id="chip-favorites" onclick="setFilter('favorites')">⭐ Favoritos <span class="count" id="count-favorites">0</span></div>
    <div class="filter-chip"        id="chip-groups"   onclick="setFilter('groups')">Grupos <span class="count" id="count-groups">0</span></div>
    <div class="filter-chip"        id="chip-archived" onclick="setFilter('archived')">Archivados <span class="count" id="count-archived">0</span></div>
  </div>

  <div id="chatList">
    <div id="emptyState">
      <div class="empty-icon">💬</div>
      <p>Sin conversaciones aún.<br>Los mensajes de WhatsApp<br>aparecerán aquí.</p>
    </div>
  </div>

  <div id="overlay" onclick="closeCtxMenu()"></div>
  <div id="ctxMenu">
    <div class="ctx-item" onclick="ctxAction('fav')"><span class="ctx-icon">⭐</span><span id="ctx-fav-label">Agregar favorito</span></div>
    <div class="ctx-item" onclick="ctxAction('archive')"><span class="ctx-icon">📦</span><span id="ctx-archive-label">Archivar</span></div>
    <div class="ctx-item" onclick="ctxAction('read')"><span class="ctx-icon">✓</span><span>Marcar como leído</span></div>
    <div class="ctx-item danger" onclick="ctxAction('delete')"><span class="ctx-icon">🗑️</span><span>Eliminar del panel</span></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
