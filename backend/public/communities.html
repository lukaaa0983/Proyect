<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunidades</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    body{background:#0b141a}
    #topbar{background:#0b141a !important;border-bottom:none !important}
    #title{font-size:24px !important;color:#e9edef !important;font-weight:700 !important}
    #bottomNav{background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;padding-top:6px;padding-bottom:env(safe-area-inset-bottom);flex-shrink:0}
    .nav-item{flex:1;display:flex;justify-content:center;padding:6px 0 8px;cursor:pointer}
    .nav-pill{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:18px;color:#8696a0;font-size:12px;transition:.2s}
    .nav-item.active .nav-pill{background:#0b3c2e;color:#fff;font-weight:600}
    .nav-ic svg{display:block}
    #empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;color:var(--text-dim);text-align:center}
  </style>
<style id="wa-nav2">
html #bottomNav{display:flex;justify-content:space-around;align-items:flex-start;background:#0b141a !important;border-top:1px solid #1c272e !important;padding:6px 0 env(safe-area-inset-bottom) !important;flex-shrink:0}
html #bottomNav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:4px 0 6px !important;cursor:pointer;color:#e9edef !important;font-size:12px !important;font-weight:400;text-align:center;line-height:1.1}
html #bottomNav .nav-item.active{color:#e9edef !important;font-weight:700}
html #bottomNav .nav-item > div.nav-pill:first-child{width:58px;height:30px;border-radius:15px;display:flex;flex-direction:row;gap:0;align-items:center;justify-content:center;padding:0;background:transparent;filter:none;opacity:1;font-size:inherit !important;color:inherit;font-weight:inherit;transition:background .2s}
html #bottomNav .nav-item.active > div.nav-pill:first-child{background:#0f3a2d;filter:none;opacity:1}
html #bottomNav .nav-ic{position:relative;display:flex;font-size:inherit !important}
html #bottomNav .nav-ic svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html #bottomNav .nav-item.active .nav-ic svg .fl{fill:#d9fdd3;stroke:#d9fdd3}
html #bottomNav .nav-item.active .nav-ic svg .st{stroke:#d9fdd3}
html #bottomNav .nav-item.active .nav-ic svg .dt{stroke:#0f3a2d}
html #bottomNav .nav-label{font-size:12px}
</style>
<style id="wa-bg">
:root{--bg:#0b1014}
html body{background:#0b1014}
html #topbar,html #searchBar,html #archbar{background:#0b1014 !important}
html #filters,html #chatList,html .section-label,html #emptyState{background:#0b1014}
html .chat-item{background:#0b1014}
html #bottomNav{background:#0b1014 !important;border-top-color:#161c20 !important}
</style>
</head>
<body>
  <div id="topbar">
    <div id="title">Comunidades</div>
  </div>
  <div id="empty">
    <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#8696a0" stroke-width="1.4">
      <circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.6"/>
      <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
      <path d="M14.3 14.4c2.7.3 4.7 2.5 4.7 5.6"/>
    </svg>
    <p>Las comunidades todavía no están disponibles en este panel.</p>
  </div>
  <div id="bottomNav">
    <div class="nav-item" onclick="location.href='/'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M3 4h15a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path class="dt" d="M7.5 9.5h9M7.5 13.5h6"/></svg></div></div>
      <div class="nav-label">Chats</div>
    </div>
    <div class="nav-item" onclick="location.href='/statuses.html'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M12 2a9.5 9.5 0 1 1-4.6 17.8L2.5 21.5l1.7-4.9A9.5 9.5 0 0 1 12 2z"/><circle class="dt" cx="12" cy="11.5" r="4.2"/></svg></div></div>
      <div class="nav-label">Novedades</div>
    </div>
    <div class="nav-item active" onclick="location.href='/communities.html'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fl" cx="12" cy="7.8" r="2.7"/><path class="fl" d="M6.8 19.2v-.6c0-2.4 2.3-4.2 5.2-4.2s5.2 1.8 5.2 4.2v.6z"/><circle class="fl" cx="4.6" cy="9.6" r="2"/><circle class="fl" cx="19.4" cy="9.6" r="2"/><path class="st" d="M2 17.5c0-1.8 1.2-3.2 3-3.5"/><path class="st" d="M22 17.5c0-1.8-1.2-3.2-3-3.5"/></svg></div></div>
      <div class="nav-label">Comunidades</div>
    </div>
    <div class="nav-item" onclick="location.href='/calls.html'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M20 15.5c-1.25 0-2.45-.2-3.57-.57a1 1 0 0 0-1.02.24l-2.2 2.2a15 15 0 0 1-6.59-6.59l2.2-2.21a1 1 0 0 0 .25-1A11.4 11.4 0 0 1 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/></svg></div></div>
      <div class="nav-label">Llamadas</div>
    </div>
  </div>
<script id="wa-nav2-js">(function(){var p=location.pathname,i=p.indexOf('/status')===0?1:p.indexOf('/communit')===0?2:p.indexOf('/calls')===0?3:0;document.querySelectorAll('#bottomNav .nav-item').forEach(function(e,k){e.classList.toggle('active',k===i)})})()</script>
</body>
</html>
