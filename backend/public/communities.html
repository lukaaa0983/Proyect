<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunidades</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    body{background:#0b141a}
    #topbar{background:#0b141a !important;border-bottom:none !important}
    #title{font-size:24px !important;color:#e9edef !important;font-weight:700 !important}
    #bottomNav{background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;padding-top:6px;padding-bottom:env(safe-area-inset-bottom);flex-shrink:0}
    .nav-item{flex:1;display:flex;justify-content:center;padding:6px 0 8px;cursor:pointer}
    .nav-pill{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border-radius:18px;color:#8696a0;font-size:12px;transition:.2s}
    .nav-item.active .nav-pill{background:#0b3c2e;color:#fff;font-weight:600}
    .nav-ic svg{display:block}
    #empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;color:var(--text-dim);text-align:center}
  </style>
</head>
<body>
  <div id="topbar">
    <div id="title">Comunidades</div>
  </div>
  <div id="empty">
    <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#8696a0" stroke-width="1.4">
      <circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.6"/>
      <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
      <path d="M14.3 14.4c2.7.3 4.7 2.5 4.7 5.6"/>
    </svg>
    <p>Las comunidades todavía no están disponibles en este panel.</p>
  </div>
  <div id="bottomNav">
    <div class="nav-item" onclick="location.href='/'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div><div class="nav-label">Chats</div></div>
    </div>
    <div class="nav-item" onclick="location.href='/statuses.html'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="12" r="6.5"/><circle cx="16" cy="8" r="4"/></svg></div><div class="nav-label">Novedades</div></div>
    </div>
    <div class="nav-item active" onclick="location.href='/communities.html'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3.5 20c0-3.3 2.5-6 6-6s6 2.7 6 6"/><path d="M14.5 14.3c2.6.3 4.5 2.4 4.5 5.2"/></svg></div><div class="nav-label">Comunidades</div></div>
    </div>
    <div class="nav-item" onclick="location.href='/calls.html'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5c0-1 1-2 2-2h2l2 5-2 1.5a12 12 0 0 0 5.5 5.5L15 13l5 2v2c0 1-1 2-2 2C10 19 4 13 4 5z"/></svg></div><div class="nav-label">Llamadas</div></div>
    </div>
  </div>
</body>
</html>
