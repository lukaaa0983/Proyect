<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1014;color:#e9edef;font-family:system-ui,sans-serif;height:100dvh;overflow-y:auto}
#top{display:flex;align-items:center;gap:18px;padding:14px 16px;font-size:22px}#top b{font-size:20px;font-weight:600}.back{cursor:pointer;padding:0 6px}
#av{width:130px;height:130px;border-radius:50%;background:#3a2c1e;margin:10px auto;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}#av img{width:100%;height:100%;object-fit:cover}
.hint{text-align:center;color:#00a884;font-size:14px;cursor:pointer;margin-bottom:18px}
.f{padding:12px 22px}.f label{display:block;color:#8696a0;font-size:13px;margin-bottom:6px}
.f input{width:100%;background:transparent;border:none;border-bottom:2px solid #2a3942;color:#e9edef;font-size:18px;padding:8px 0;outline:none}.f input:focus{border-color:#00a884}
#save{display:block;margin:24px auto;padding:13px 40px;border:none;border-radius:24px;background:#00a884;color:#000;font-size:16px;font-weight:600;cursor:pointer}
#toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#2a3942;padding:10px 18px;border-radius:20px;display:none;font-size:14px}
</style>
</head>
<body>
<div id="top"><span class="back" onclick="history.back()">←</span><b>Perfil</b></div>
<div id="av" onclick="pick()"><svg width="60" height="60" viewBox="0 0 24 24" fill="#f6c36b"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c0-4.6 3.8-7.2 8.5-7.2s8.5 2.6 8.5 7.2z"/></svg></div>
<div class="hint" onclick="pick()">Cambiar foto</div>
<div class="f"><label>Nombre</label><input id="name" maxlength="25"></div>
<div class="f"><label>Info</label><input id="about" maxlength="139"></div>
<div class="f"><label>Número</label><input id="num" disabled></div>
<button id="save" onclick="save()">Guardar</button>
<input type="file" id="file" accept="image/*" style="display:none">
<div id="toast"></div>
<script>
const $ = s => document.getElementById(s)
let photo = null
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2400) }
function pick() { $('file').click() }
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return
  const fr = new FileReader()
  fr.onload = () => { photo = fr.result; $('av').innerHTML = '<img src="' + photo + '">' }
  fr.readAsDataURL(f)
}
async function load() {
  const r = await (await fetch('/api/me')).json()
  if (!r.ok) { toast('No se pudo cargar. ¿El bot está conectado?'); return }
  $('name').value = r.name; $('about').value = r.about; $('num').value = '+' + r.number
  if (r.url) $('av').innerHTML = '<img src="' + r.url + '">'
}
async function save() {
  const r = await (await fetch('/api/me', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('name').value.trim(), about: $('about').value, photo }) })).json()
  toast(r.ok ? 'Perfil actualizado' : (r.error || 'No se pudo guardar'))
}
load()
</script>
</body>
</html>
