<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estados</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    body { display: flex; flex-direction: column; height: 100dvh; }
    #topbar { background: var(--surface); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #topbar-title { font-size: 20px; font-weight: 700; }
    #statusesList { flex: 1; overflow-y: auto; }
    #lightbox { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; }
    #lightbox.open { display: flex; }
    #lightbox-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--surface); }
    #lightbox-close { cursor: pointer; font-size: 24px; color: var(--text); }
    #lightbox-body { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #lightbox-body img, #lightbox-body video { max-width: 100%; max-height: 100%; object-fit: contain; }
    #lightbox-footer { padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: center; }
    .lb-btn { padding: 10px 20px; background: var(--gold); color: #000; border-radius: 20px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; }
    #bottomNav { display: flex; justify-content: space-around; align-items: center; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
    .nav-item { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: var(--text-dim); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.2s; }
    .nav-item.active { color: var(--gold); }
    .nav-icon { font-size: 24px; }
    .status-item { padding: 12px 16px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
    .status-item:active { background: var(--surface2); }
    .status-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg,var(--gold),var(--gold-dim)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: #000; flex-shrink: 0; }
    .status-info { flex: 1; }
    .status-name { font-weight: 600; font-size: 15px; color: var(--text); }
    .status-time { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    #lightbox { height: 100dvh; }
    #bottomNav { padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
    #lightbox-footer { padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); gap: 12px; }
    #lightbox-footer .lb-btn { flex: 1; padding: 15px 10px; font-size: 15px; border-radius: 14px; background: var(--gold); color: #000; box-shadow: 0 2px 10px rgba(0,0,0,.6); }
    #lightbox-footer .lb-btn:active { transform: scale(.97); }
  </style>
<style id="wa-nav">
#bottomNav{background:#0b141a !important;border-top:1px solid #1c272e !important;padding-top:6px}
#bottomNav .nav-item{color:#8696a0 !important;font-size:12px !important;padding:6px 0 4px !important;gap:2px !important}
#bottomNav .nav-item > div:first-child{width:58px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:20px !important;filter:grayscale(1);opacity:.75;transition:.2s}
#bottomNav .nav-item.active{color:#e9edef !important;font-weight:600}
#bottomNav .nav-item.active > div:first-child{background:#103629;filter:none;opacity:1}
#ctxMenu{background:#1f2c34 !important;border:none !important;border-radius:16px !important;box-shadow:0 8px 28px rgba(0,0,0,.6) !important}
.ctx-item{color:#e9edef !important;border-bottom:none !important;padding:15px 22px !important;font-size:16px}
.ctx-item:active{background:#2a3942 !important}
#archbar{display:none;align-items:center;gap:18px;padding:14px 16px;background:#0b141a;color:#e9edef;font-size:20px;font-weight:600}
body.arch-mode #topbar,body.arch-mode #fab{display:none !important}
body.arch-mode #archbar{display:flex}
</style>
<style id="wa-nav2">
html #bottomNav{display:flex;justify-content:space-around;align-items:flex-start;background:#0b141a !important;border-top:1px solid #1c272e !important;padding:6px 0 env(safe-area-inset-bottom) !important;flex-shrink:0}
html #bottomNav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:4px 0 6px !important;cursor:pointer;color:#e9edef !important;font-size:12px !important;font-weight:400;text-align:center;line-height:1.1}
html #bottomNav .nav-item.active{color:#e9edef !important;font-weight:700}
html #bottomNav .nav-item > div.nav-pill:first-child{width:58px;height:30px;border-radius:15px;display:flex;flex-direction:row;gap:0;align-items:center;justify-content:center;padding:0;background:transparent;filter:none;opacity:1;font-size:inherit !important;color:inherit;font-weight:inherit;transition:background .2s}
html #bottomNav .nav-item.active > div.nav-pill:first-child{background:#0f3a2d;filter:none;opacity:1}
html #bottomNav .nav-ic{position:relative;display:flex;font-size:inherit !important}
html #bottomNav .nav-ic svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
html #bottomNav .nav-item.active .nav-ic svg .fl{fill:#d9fdd3;stroke:#d9fdd3}
html #bottomNav .nav-item.active .nav-ic svg .st{stroke:#d9fdd3}
html #bottomNav .nav-item.active .nav-ic svg .dt{stroke:#0f3a2d}
html #bottomNav .nav-label{font-size:12px}
</style>
<style id="wa-bg">
:root{--bg:#0b1014}
html body{background:#0b1014}
html #topbar,html #searchBar,html #archbar{background:#0b1014 !important}
html #filters,html #chatList,html .section-label,html #emptyState{background:#0b1014}
html .chat-item{background:#0b1014}
html #bottomNav{background:#0b1014 !important;border-top-color:#161c20 !important}
</style>
</head>
<body>

  <div id="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="icon-btn" onclick="history.back()" style="color:var(--gold)">←</div>
      <div id="topbar-title">Estados</div>
    </div>
  </div>

  <div id="statusesList"></div>

  <div id="lightbox">
    <div id="lightbox-header">
      <span></span>
      <div id="lightbox-close" onclick="closeLightbox()">✕</div>
    </div>
    <div id="lightbox-body"></div>
    <div id="lightbox-footer">
      <button class="lb-btn" onclick="downloadStatus()">⬇ Descargar</button>
      <button class="lb-btn" onclick="replyStatus()">↩ Responder</button>
    </div>
  </div>

  <div id="bottomNav">
    <div class="nav-item" onclick="location.href='/'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M3 4h15a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path class="dt" d="M7.5 9.5h9M7.5 13.5h6"/></svg></div></div>
      <div class="nav-label">Chats</div>
    </div>
    <div class="nav-item active" onclick="location.href='/statuses.html'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="st" cx="12" cy="12" r="4.6"/><path class="st" d="M7.44 4.71A8.6 8.6 0 0 1 16.56 4.71"/><path class="st" d="M19.37 7.57A8.6 8.6 0 0 1 18.78 17.29"/><path class="st" d="M16.56 19.29A8.6 8.6 0 0 1 8.50 19.86"/><path class="st" d="M5.22 6.71A8.6 8.6 0 0 0 5.61 17.75L3.3 20.5L7 19"/></svg></div></div>
      <div class="nav-label">Novedades</div>
    </div>
    <div class="nav-item" onclick="location.href='/communities.html'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fl" cx="12" cy="7.8" r="2.7"/><path class="fl" d="M6.8 19.2v-.6c0-2.4 2.3-4.2 5.2-4.2s5.2 1.8 5.2 4.2v.6z"/><circle class="fl" cx="4.6" cy="9.6" r="2"/><circle class="fl" cx="19.4" cy="9.6" r="2"/><path class="st" d="M2 17.5c0-1.8 1.2-3.2 3-3.5"/><path class="st" d="M22 17.5c0-1.8-1.2-3.2-3-3.5"/></svg></div></div>
      <div class="nav-label">Comunidades</div>
    </div>
    <div class="nav-item" onclick="location.href='/calls.html'">
      <div class="nav-pill"><div class="nav-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M20 15.5c-1.25 0-2.45-.2-3.57-.57a1 1 0 0 0-1.02.24l-2.2 2.2a15 15 0 0 1-6.59-6.59l2.2-2.21a1 1 0 0 0 .25-1A11.4 11.4 0 0 1 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/></svg></div></div>
      <div class="nav-label">Llamadas</div>
    </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let statuses = []
    let currentStatus = null

    async function loadStatuses() {
      try {
        statuses = await API.getStatuses()
        renderStatuses()
      } catch (e) {
        console.log('Error:', e)
      }
    }

    function renderStatuses() {
      const list = document.getElementById('statusesList')
      list.innerHTML = ''

      if (!statuses || statuses.length === 0) {
        list.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 30px;gap:14px;color:var(--text-dim)"><div style="width:72px;height:72px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:32px">📢</div><p style="font-size:14px;text-align:center">Sin estados</p></div>`
        return
      }

      statuses.forEach((st) => {
        const el = document.createElement('div')
        el.className = 'status-item'
        
        const name = st.senderName || st.senderId
        const time = new Date(st.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })

        el.innerHTML = `
          <div class="status-avatar">${name.charAt(0).toUpperCase()}</div>
          <div class="status-info">
            <div class="status-name">${name}</div>
            <div class="status-time">${time}</div>
          </div>
        `

        el.addEventListener('click', () => {
          currentStatus = st
          openLightbox()
        })
        
        list.appendChild(el)
      })
    }

    function openLightbox() {
      if (!currentStatus) return
      
      const body = document.getElementById('lightbox-body')
      body.innerHTML = ''

      if (currentStatus.type === 'image' && currentStatus.mediaUrl) {
        const img = document.createElement('img')
        img.src = currentStatus.mediaUrl
        body.appendChild(img)
      } else if (currentStatus.type === 'video' && currentStatus.mediaUrl) {
        const vid = document.createElement('video')
        vid.src = currentStatus.mediaUrl
        vid.controls = true
        vid.autoplay = true
        body.appendChild(vid)
      } else {
        const txt = document.createElement('div')
        txt.style.cssText = 'color:var(--text);font-size:18px;text-align:center;padding:40px;word-wrap:break-word'
        txt.textContent = currentStatus.text || 'Estado de texto'
        body.appendChild(txt)
      }

      document.getElementById('lightbox').classList.add('open')
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open')
      currentStatus = null
    }

    function downloadStatus() {
      if (!currentStatus || !currentStatus.mediaUrl) return
      const a = document.createElement('a')
      a.href = currentStatus.mediaUrl
      a.download = `estado_${currentStatus.senderId}_${Date.now()}`
      a.click()
    }

    function replyStatus() {
      if (!currentStatus) return
      alert('Responder a estados en desarrollo')
    }

    loadStatuses()
  </script>
<div id="fab" onclick="statusMenu()" style="position:fixed;right:18px;bottom:90px;width:56px;height:56px;border-radius:50%;background:#00a884;color:#000;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:40;cursor:pointer">＋</div>
<script>
const SCOLORS = ['#128c7e', '#7b3fa0', '#c2410c', '#1d4ed8', '#be185d', '#4d7c0f']
async function postStatus(body) {
  const r = await (await fetch('/api/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json()
  alert(r.ok ? 'Estado publicado para ' + r.to + ' contactos' : (r.error || 'No se pudo publicar'))
}
function statusMenu() {
  const ov = document.createElement('div')
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:900;display:flex;align-items:flex-end'
  ov.onclick = e => { if (e.target === ov) ov.remove() }
  const box = document.createElement('div')
  box.style.cssText = 'background:#1f2c34;width:100%;border-radius:20px 20px 0 0;padding:12px 0 calc(16px + env(safe-area-inset-bottom));color:#e9edef'
  const rows = [
    ['✏️ Estado de texto', () => { const t = prompt('Escribe tu estado'); if (t && t.trim()) postStatus({ text: t.trim(), color: SCOLORS[Math.floor(Math.random() * SCOLORS.length)] }) }],
    ['📷 Foto o video', () => {
      const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*,video/*'
      f.onchange = () => {
        const fl = f.files[0]; if (!fl) return
        const cap = prompt('Pie de foto (opcional)') || ''
        const fr = new FileReader()
        fr.onload = () => postStatus({ mediaUrl: fr.result, type: fl.type.startsWith('video') ? 'video' : 'image', caption: cap })
        fr.readAsDataURL(fl)
      }
      f.click()
    }]
  ]
  rows.forEach(([l, fn]) => { const d = document.createElement('div'); d.textContent = l; d.style.cssText = 'padding:16px 22px;cursor:pointer'; d.onclick = () => { ov.remove(); fn() }; box.appendChild(d) })
  ov.appendChild(box); document.body.appendChild(ov)
}
</script>
<script>
;(function () {
  const idx = location.pathname.startsWith('/status') ? 1 : location.pathname.startsWith('/calls') ? 2 : 0
  document.querySelectorAll('#bottomNav .nav-item').forEach((e, i) => e.classList.toggle('active', i === idx))
})()
</script>
<script>
;(function () {
  function badge(i, n) {
    const it = document.querySelectorAll('#bottomNav .nav-item')[i]
    if (!it) return
    const ic = it.firstElementChild
    let b = ic.querySelector('.nbadge')
    if (!n) { if (b) b.remove(); return }
    if (!b) {
      b = document.createElement('span')
      b.className = 'nbadge'
      b.style.cssText = 'position:absolute;top:-4px;right:2px;background:#00a884;color:#0b141a;border-radius:9px;font-size:11px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center'
      ic.style.position = 'relative'
      ic.appendChild(b)
    }
    b.textContent = n > 99 ? '99+' : n
  }
  async function tick() {
    try {
      const cs = JSON.parse(localStorage.getItem('chatState') || '{}')
      badge(0, Object.values(cs).reduce((a, s) => a + (s.unread || 0), 0))
    } catch (e) {}
    try {
      const onCalls = location.pathname.startsWith('/calls')
      const seen = +localStorage.getItem('callsSeen') || 0
      if (onCalls) localStorage.setItem('callsSeen', Date.now())
      const calls = await (await fetch('/calls')).json()
      badge(3, onCalls ? 0 : calls.filter(c => (c.status === 'timeout' || c.status === 'reject') && (c.date || 0) > seen).length)
    } catch (e) {}
  }
  tick()
  setInterval(tick, 5000)
})()
</script>
<script id="wa-nav2-js">(function(){var p=location.pathname,i=p.indexOf('/status')===0?1:p.indexOf('/communit')===0?2:p.indexOf('/calls')===0?3:0;document.querySelectorAll('#bottomNav .nav-item').forEach(function(e,k){e.classList.toggle('active',k===i)})})()</script>
